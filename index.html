<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Coming Soon | Audora Co</title>
    <meta name="description" content="Audora Co premium soft play hire is coming soon." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&amp;family=DM+Serif+Display:ital@0;1&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #4f433d;
        --muted: #746a65;
        --cream: #fcfbfa;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--cream);
        color: var(--ink);
        font-family: "DM Sans", sans-serif;
      }

      main {
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 64px 24px;
        text-align: center;
      }

      .coming-soon {
        width: min(100%, 760px);
      }

      .logo {
        display: block;
        width: clamp(170px, 22vw, 255px);
        height: auto;
        margin: 0 auto 68px;
      }

      h1 {
        max-width: 720px;
        margin: 0 auto;
        font-family: "DM Serif Display", serif;
        font-size: clamp(42px, 6vw, 74px);
        font-weight: 400;
        letter-spacing: 0.025em;
        line-height: 1.08;
        text-transform: uppercase;
      }

      .intro {
        margin: 28px auto 0;
        color: var(--muted);
        font-size: clamp(14px, 1.6vw, 17px);
        line-height: 1.8;
      }

      .location {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .status {
        margin: 54px 0 0;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .instagram {
        margin: 13px 0 0;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.08em;
      }

      @media (max-width: 520px) {
        main {
          padding: 48px 22px;
        }

        .logo {
          width: 165px;
          margin-bottom: 52px;
        }

        h1 {
          font-size: clamp(38px, 12vw, 52px);
        }

        .intro {
          max-width: 300px;
          margin-top: 24px;
          font-size: 14px;
        }

        .status {
          margin-top: 44px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="coming-soon" aria-labelledby="coming-soon-title">
        <img class="logo" src="audora-logo-transparent.png" alt="Audora Co" />
        <h1 id="coming-soon-title">Something Beautiful Is Coming.</h1>
        <p class="intro">Premium soft play hire for little celebrations.</p>
        <p class="location">Sydney, Australia.</p>
        <p class="status">Coming Soon</p>
        <p class="instagram">@audoraco.au</p>
      </section>
    </main>
  </body>
</html>
